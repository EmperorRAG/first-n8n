name: infra-drift

# Scheduled drift detection. Runs `az deployment group what-if` against
# `main` and fails the workflow if there is any Modify or Delete delta
# (i.e. someone changed Azure state outside Bicep). Create deltas are
# allowed — they typically mean a new module was added since the last
# deploy and a deploy is pending.
#
# Read-only against Azure. Posts a Job Summary with the full what-if
# diff regardless of outcome. No PR commenting (no PR exists).

on:
  schedule:
    # Mondays 14:00 UTC. Adjust if you need a different cadence.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-drift
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-n8n-01-dev
  TEMPLATE_FILE: infra/main.bicep
  PARAMETERS_FILE: infra/main.dev.bicepparam
  DEPLOYMENT_NAME: first-n8n-main-drift-${{ github.run_id }}

jobs:
  drift:
    name: Detect Azure drift vs main
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (JSON for classification)
        id: whatif_json
        # `--no-pretty-print` returns unformatted JSON containing the
        # canonical `changeType` per top-level resource. Parsing this is
        # much more reliable than grepping the human-readable diff
        # (which also marks nested property changes with `~`/`-`).
        # `continue-on-error` so the summary + classifier always run.
        continue-on-error: true
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file "${TEMPLATE_FILE}" \
            --parameters "${PARAMETERS_FILE}" \
            --name "${DEPLOYMENT_NAME}" \
            --no-pretty-print \
            > whatif.json 2> whatif.err || echo "EXIT=$?" >> whatif.err

      - name: What-if (pretty for Job Summary)
        id: whatif_pretty
        continue-on-error: true
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file "${TEMPLATE_FILE}" \
            --parameters "${PARAMETERS_FILE}" \
            --name "${DEPLOYMENT_NAME}-pretty" \
            > whatif.txt 2>&1 || echo "EXIT=$?" >> whatif.txt
          # Strip ANSI colour codes for cleaner Markdown rendering.
          sed -i 's/\x1b\[[0-9;]*m//g' whatif.txt

      - name: Classify drift
        id: classify
        # See [.github/scripts/classify-drift.py](../scripts/classify-drift.py)
        # for the noise-filtering logic and rationale. The script writes
        # GH-Actions outputs to stdout and the list of real-Modify
        # resource IDs to `real_modifies.txt` for the Job Summary.
        run: |
          set -euo pipefail
          python3 .github/scripts/classify-drift.py | tee -a "${GITHUB_OUTPUT}"
          if [ -s real_modifies.txt ]; then
            echo "Real Modify resourceIds:"
            cat real_modifies.txt
          fi

      - name: Job summary
        run: |
          {
            echo "## infra-drift report"
            echo ""
            echo "| Change type | Count |"
            echo "|---|---|"
            echo "| Modify (real drift) | ${{ steps.classify.outputs.modify_real }} |"
            echo "| Modify (known what-if noise, ignored) | $(( ${{ steps.classify.outputs.modify_total }} - ${{ steps.classify.outputs.modify_real }} )) |"
            echo "| Delete (drift) | ${{ steps.classify.outputs.delete }} |"
            echo "| Create (pending deploy) | ${{ steps.classify.outputs.create }} |"
            echo ""
            if [ -s real_modifies.txt ]; then
              echo "### Real Modify resource IDs"
              echo ""
              echo '```'
              cat real_modifies.txt
              echo '```'
              echo ""
            fi
            echo "<details><summary>Full what-if output</summary>"
            echo ""
            echo '```'
            head -c 60000 whatif.txt
            if [ "$(wc -c < whatif.txt)" -gt 60000 ]; then
              printf '\n\n...[truncated at 60k chars]...\n'
            fi
            echo '```'
            echo ""
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on drift
        # Drift = any Delete row, OR any Modify row on a non-noise
        # resource type. Create rows mean Bicep is ahead of Azure (a
        # deploy is pending), not that Azure was changed out-of-band —
        # surfaced in the summary but not failed.
        run: |
          set -euo pipefail
          modify_real="${{ steps.classify.outputs.modify_real }}"
          delete="${{ steps.classify.outputs.delete }}"
          if [ "${modify_real}" != "0" ] || [ "${delete}" != "0" ]; then
            echo "::error::Azure drift detected: ${modify_real} real Modify, ${delete} Delete (see Job Summary)."
            exit 1
          fi
          echo "No drift."
